<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPage - Autoškola</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #121a24;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }
        .app-container {
            width: 100%; max-width: 420px; height: 100%; max-height: 850px;
            background-color: #121a24;
            display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.6);
            position: relative; overflow: hidden;
        }
        .top-bar {
            background-color: #182624;
            padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #263749;
        }
        .menu-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .title-area { text-align: center; }
        .title-area h2 { margin: 0; font-size: 16px; color: #fff; }
        .title-area p { margin: 2px 0 0 0; font-size: 11px; color: #8c9baf; }
        
        .mini-schedule-bar {
            background-color: #16202b;
            padding: 6px 10px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 10px; border-bottom: 1px solid #263749;
            color: #b4becd;
            overflow-x: auto;
        }
        .mini-slot { text-align: center; padding: 0 4px; border-right: 1px solid #263749; }
        .mini-slot span { display: block; font-weight: bold; color: #ff8c5a; font-size: 11px; }

        .grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 8px; padding: 10px; overflow-y: auto; flex-grow: 1;
        }
        .tile {
            background-color: #1a2636; padding: 12px; border-radius: 8px;
            cursor: pointer; transition: transform 0.1s, background 0.2s;
            display: flex; align-items: center; gap: 12px;
            border-left: 5px solid #3b82f6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .tile:hover { background-color: #223247; transform: translateY(-1px); }
        .tile-icon-box {
            width: 38px; height: 38px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0;
        }
        .tile-content h3 { margin: 0; font-size: 13px; color: #fff; }
        .tile-content p { margin: 3px 0 0 0; font-size: 10px; color: #9ba8b8; }

        .drawer {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background-color: #182624; transition: left 0.3s ease;
            z-index: 100; box-shadow: 4px 0 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .drawer.open { left: 0; }
        .drawer-header {
            background-color: #121a24; padding: 20px 15px; border-bottom: 1px solid #263749;
            display: flex; justify-content: space-between; align-items: center;
        }
        .drawer-header h3 { margin: 0; color: #4CAF50; font-size: 16px; }
